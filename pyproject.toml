[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "repo-proof"
version = "0.1.0"
description = "Evidence-first GitHub repository and milestone quality auditing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xiaosen017-maker" }]
keywords = ["github", "repository", "milestone", "quality", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-proof = "repo_proof.cli:main"

[project.urls]
Repository = "https://github.com/xiaosen017-maker/repo-proof"
Issues = "https://github.com/xiaosen017-maker/repo-proof/issues"
Changelog = "https://github.com/xiaosen017-maker/repo-proof/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_proof"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
